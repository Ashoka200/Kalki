name: kalki-tests

# Runs the NLU test suite on every change. Hosting is on Netlify
# (connected to this repo; see netlify.toml), which redeploys
# automatically on pushes to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/nlu.test.mjs
